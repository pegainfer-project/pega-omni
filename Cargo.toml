[workspace]
resolver = "3"
members = [
    "crates/omni-engine",
    "crates/omni-sim",
    "crates/omni-frontend",
    "crates/omni-server",
    "crates/omni-bench",
    "crates/omni-kern",
    "crates/omni-qwen3-tts",
    "crates/omni-personaplex",
]
# A plain `cargo build` needs no CUDA toolkit; `--workspace` builds the GPU crates too.
default-members = [
    "crates/omni-engine",
    "crates/omni-sim",
    "crates/omni-frontend",
    "crates/omni-server",
    "crates/omni-bench",
    "crates/omni-kern",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pegainfer-project/pega-omni"

[workspace.dependencies]
omni-engine = { path = "crates/omni-engine" }
omni-sim = { path = "crates/omni-sim" }
omni-frontend = { path = "crates/omni-frontend" }
omni-kern = { path = "crates/omni-kern" }
omni-qwen3-tts = { path = "crates/omni-qwen3-tts" }
omni-personaplex = { path = "crates/omni-personaplex" }

anyhow = "1"
# G.711 (`audio/pcmu`, `audio/pcma`) for the live endpoint: the ITU tables,
# already in the tree under rubato.
audio-codec-algorithms = "0.8"
# `ws`: the live endpoint is a WebSocket; axum's own upgrade over tungstenite
# keeps it on the same server and connection handling as the HTTP routes.
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
half = "2"
# The model runs as a kern manifest: kern-manifest is its schema and verifier,
# kern-runtime executes it (graphs per batch bucket, paged KV and per-sequence
# state slots from kern-pool).
kern-manifest = { git = "https://github.com/pegainfer-project/kern", rev = "78c73047bb4f8981ff6aa8fc44ccaf1dab43a3a9" }
kern-pool = { git = "https://github.com/pegainfer-project/kern", rev = "78c73047bb4f8981ff6aa8fc44ccaf1dab43a3a9" }
kern-runtime = { git = "https://github.com/pegainfer-project/kern", rev = "78c73047bb4f8981ff6aa8fc44ccaf1dab43a3a9" }
hdrhistogram = "7"
http-body-util = "0.1"
memmap2 = "0.9"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
mimalloc = "0.1"
pprof = { version = "0.15", features = ["flamegraph"] }
proptest = "1"
rand = "0.10"
rand_distr = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
# The live endpoint's 16 kHz and G.711 formats meet the engine's rate through
# a band-limited FFT resampler with fixed chunks, so a stream's output does not
# depend on how its input was split.
rubato = "5"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
# omni-bench's live client: the tokio binding of the tungstenite stack axum's
# `ws` already builds on.
tokio-tungstenite = "0.29"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
disallowed_types = "deny"
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"

[profile.release]
debug = "line-tables-only"
