name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dco:
    if: github.event_name == 'pull_request'
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check commit sign-offs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          unsigned=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits?per_page=100" \
            --jq '.[] | select(.commit.message | test("(?m)^Signed-off-by: .+ <.+@.+>") | not) | .sha[0:10]')
          if [ -n "$unsigned" ]; then
            echo "::error::commits without Signed-off-by: $unsigned (fix: git rebase --signoff origin/main)"
            exit 1
          fi

  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    env:
      CUDA: "13-4"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install the CUDA compiler and headers (build.rs compiles the kernels to cubins)
        run: |
          set -euo pipefail
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends cuda-nvcc-$CUDA cuda-cudart-dev-$CUDA
          cuda=/usr/local/cuda-${CUDA/-/.}
          echo "$cuda/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  qwen3-tts:
    name: Qwen3-TTS compile (sm_${{ matrix.cuda_arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cuda_arch: ["86", "103a"]
    env:
      CUDA: "13-4"
      OMNI_CUDA_ARCH: ${{ matrix.cuda_arch }}
      CARGO_TARGET_DIR: target/qwen3-tts-${{ matrix.cuda_arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the CUDA compiler and headers
        run: |
          set -euo pipefail
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends cuda-nvcc-$CUDA cuda-cudart-dev-$CUDA
          cuda=/usr/local/cuda-${CUDA/-/.}
          echo "$cuda/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: qwen3-tts-${{ matrix.cuda_arch }}
          workspaces: . -> target/qwen3-tts-${{ matrix.cuda_arch }}
      - name: Build the Qwen3-TTS server
        run: cargo build --release --locked -p omni-server --no-default-features --features qwen3-tts
      - name: Compile the GPU golden test
        run: cargo test --release --locked -p omni-qwen3-tts --test golden --no-run

  e2e:
    name: OpenAI SDK, GPT-Live and load smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo build --release --locked
      - name: Start the simulated engine
        run: |
          target/release/pega-omni sim --listen 127.0.0.1:8000 --step-base-us 1000 > server.log 2>&1 &
          for _ in $(seq 50); do curl -sf localhost:8000/health && exit 0; sleep 0.2; done
          cat server.log; exit 1
      - name: Official openai SDK conforms
        run: uv run --with openai tools/openai_sdk_check.py --base-url http://127.0.0.1:8000/v1
      - name: Speech concurrency and cancellation
        run: uv run tools/speech_e2e_check.py --base-url http://127.0.0.1:8000/v1
      - name: Start the simulated image engine
        run: |
          target/release/pega-omni sim-image --listen 127.0.0.1:8002 > server-image.log 2>&1 &
          for _ in $(seq 50); do curl -sf localhost:8002/health && exit 0; sleep 0.2; done
          cat server-image.log; exit 1
      - name: Official openai SDK conforms on images
        run: uv run --with openai tools/openai_images_check.py --base-url http://127.0.0.1:8002/v1
      - name: Load smoke, raw audio
        run: target/release/omni-bench --num-requests 20000 --max-concurrency 256 --extra '{"frames":13}' --warmup 256
      - name: Load smoke, SSE wav
        run: target/release/omni-bench --num-requests 5000 --max-concurrency 256 --response-format wav --stream-format sse --extra '{"frames":13}'
      - name: Start the simulated live engine
        run: |
          target/release/pega-omni sim-live --listen 127.0.0.1:8001 > live.log 2>&1 &
          for _ in $(seq 50); do curl -sf localhost:8001/health && exit 0; sleep 0.2; done
          cat live.log; exit 1
      - name: GPT-Live protocol conforms (official openai SDK)
        run: uv run tools/live_check.py --base-url http://127.0.0.1:8001/v1
      - name: Duplex smoke
        run: target/release/omni-bench duplex --base-url http://127.0.0.1:8001 --ramp 8,32 --seconds 5
