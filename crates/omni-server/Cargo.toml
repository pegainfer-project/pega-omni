[package]
name = "omni-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pega-omni"
path = "src/main.rs"

[features]
# pprof's sampler (SIGPROF, no perf_event access needed) behind `--cpu-profile`.
cpu-profile = ["dep:pprof"]
# The Qwen3-TTS engine; needs the CUDA toolkit to build.
qwen3-tts = ["dep:omni-qwen3-tts", "dep:omni-cuda"]

[dependencies]
omni-engine.workspace = true
omni-frontend.workspace = true
omni-sim.workspace = true
omni-cuda = { workspace = true, optional = true }
omni-qwen3-tts = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
metrics-exporter-prometheus.workspace = true
pprof = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
